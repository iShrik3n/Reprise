# Reprise: static single-page app + a small API that fetches YouTube audio.
# Installed by deploy/provision.sh as /etc/nginx/sites-available/reprise.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/reprise;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Fetched audio, served straight from the API's cache (range requests work for seeking).
    location ~ "^/api/audio/([A-Za-z0-9_-]{11})\.m4a$" {
        alias /var/cache/reprise/audio/$1.m4a;
        types { }
        default_type audio/mp4;
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/youtube {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 330s;   # a download can take a while; the API gives up at 300 s
        client_max_body_size 4k;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        return 404;
    }

    # index.html must always be revalidated so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
